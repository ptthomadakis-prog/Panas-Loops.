<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beat License - PANAS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="premium-beat.css" />
</head>
<body>
  <div class="page-noise"></div>
  <header class="premium-header">
    <a class="premium-brand" href="index.html">PANAS</a>
    <nav>
      <a id="backToBeat" href="premium-beat.html">Beat</a>
      <a href="browse-beats.html">Beats</a>
      <a href="cart.html">Cart</a>
    </nav>
  </header>

  <main>
    <section class="section-shell" id="licensePage">
      <div class="section-heading">
        <p class="eyebrow">Selected License</p>
        <h2 id="licenseName">MP3 Lease</h2>
      </div>
      <div class="license-grid license-detail-grid">
        <article class="license-card featured-license">
          <h3 id="beatTitle">IN THE AIR</h3>
          <strong id="licensePrice">$19.99</strong>
          <p id="licenseDescription">Tagged MP3 file for demos, YouTube, and basic streaming use.</p>
          <ul id="licenseFeatures">
            <li>Tagged MP3 file</li>
            <li>Demo-ready audio</li>
            <li>Basic streaming file</li>
          </ul>
          <button id="addLicenseToCart" type="button">Add To Cart</button>
        </article>
      </div>
    </section>
  </main>

  <script src="license.js"></script>
</body>
</html>
